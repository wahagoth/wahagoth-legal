<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legal · Waha - goth</title>
<style>
:root { --ink: #1c1c1e; --muted: #5e5e66; --pink: #f9198b; --line: #f1d6e4; --wash: #fff6fa; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--wash); color: var(--ink); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
header { background: linear-gradient(120deg, #ff6a3d, var(--pink) 55%, #c2187a); color: #fff; padding: 28px 20px 24px; }
header .brand { font-weight: 800; letter-spacing: 0.08em; font-size: 13px; opacity: 0.9; }
header h1 { margin: 6px 0 0; font-size: 26px; line-height: 1.2; }
nav { display: flex; gap: 16px; margin-top: 14px; font-size: 14px; }
nav a { color: #fff; opacity: 0.85; }
nav a.on { opacity: 1; font-weight: 700; }
main { max-width: 760px; margin: 0 auto; padding: 8px 20px 48px; }
main > h1:first-child { display: none; }
h2 { font-size: 20px; margin: 32px 0 8px; padding-top: 12px; border-top: 1px solid var(--line); }
h3 { font-size: 17px; margin: 22px 0 6px; }
p, li { color: var(--muted); }
strong { color: var(--ink); }
a { color: var(--pink); }
code { background: #fbe4ef; padding: 1px 6px; border-radius: 6px; font-size: 14px; }
table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 14px; background: #fff; border-radius: 12px; overflow: hidden; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: #fde8f2; color: var(--ink); }
footer { text-align: center; color: var(--muted); font-size: 13px; padding: 0 20px 32px; }
</style>
</head>
<body>
<header>
<div class="brand">WAHA · GOTH</div>
<h1>Legal</h1>
<nav><a class="" href="wahagoth/terms/">Terms of Service</a><a class="" href="wahagoth/privacy/">Privacy Policy</a></nav>
</header>
<main>
<h2>Waha - goth</h2>
<ul>
<li><a href="wahagoth/terms/">Terms of Service</a></li>
<li><a href="wahagoth/privacy/">Privacy Policy</a></li>
</ul>
</main>
<footer>Waha - goth · wahagoth@gmail.com</footer>
</body>
</html>
